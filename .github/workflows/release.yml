name: Release

# Builds the app and attaches a disk image to the GitHub release for a version tag, creating a draft release if
# none exists yet. Run by hand, it builds the branch and keeps the disk image as a workflow artifact instead, to
# try the build without releasing. It runs when a tag is pushed, and from the weekly pf2e update. The items come
# from the pf2e release in pf2e.release, and the cards' art and action icon font from the private Artwork
# submodule, as a local "REXARD_PACKS=Artwork/rexard make items" does.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The version tag to build, such as v1.2.3.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build and attach the disk image
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
      # False for a trial build of a branch, run by hand.
      RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Fetch artwork
        env:
          ARTWORK_SSH_KEY: ${{ secrets.ARTWORK_SSH_KEY }}
        run: |
          printf '%s\n' "$ARTWORK_SSH_KEY" > "$RUNNER_TEMP/artwork_key"
          chmod 600 "$RUNNER_TEMP/artwork_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/artwork_key -o IdentitiesOnly=yes" \
            git submodule update --init --depth 1 Artwork

      - name: Derive the version from the tag
        if: env.RELEASING == 'true'
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Import the items and the cards' art
        run: REXARD_PACKS=Artwork/rexard scripts/import-items.sh

      - name: Check the items match a local import
        run: |
          if ! git diff --quiet import.sha256; then
            echo "::warning::The imported items differ from import.sha256: run make items and commit it."
          fi

      - name: Test
        run: scripts/coverage.sh

      - name: Add the Developer ID certificate to a temporary keychain
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: scripts/add-signing-certificate.sh

      - name: Build the universal app
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Make the disk image
        run: scripts/make-dmg.sh

      - name: Notarize the disk image
        if: env.RELEASING == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/notarize.sh "build/Pawn-Shop-$VERSION.dmg"

      - name: Keep the disk image of a trial build
        if: env.RELEASING != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: disk-image
          path: build/Pawn-Shop-*.dmg

      - name: Attach the disk image to the release
        if: env.RELEASING == 'true'
        run: |
          # A release made for a pushed tag normally appears right after the push; give it a moment.
          for _ in 1 2 3 4 5 6; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes \
              --notes "Items from the pf2e system's $(cut -d ' ' -f 2- pf2e.release | sed 's/ / and /') release."
          fi
          gh release upload "$TAG" "build/Pawn-Shop-$VERSION.dmg" --clobber
