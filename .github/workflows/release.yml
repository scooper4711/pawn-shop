name: Release

# Tests each pushed version tag. The disk image is built and attached on a Mac
# with Generated/ (make items, then make release-dmg), since the item list and
# the Rexard art it holds are built from local copies that can't be published.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Test the release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Fetch artwork
        env:
          ARTWORK_SSH_KEY: ${{ secrets.ARTWORK_SSH_KEY }}
        run: |
          if [ -z "$ARTWORK_SSH_KEY" ]; then
            echo "ARTWORK_SSH_KEY is not set; skipping the private Artwork submodule."
            exit 0
          fi
          printf '%s\n' "$ARTWORK_SSH_KEY" > "$RUNNER_TEMP/artwork_key"
          chmod 600 "$RUNNER_TEMP/artwork_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/artwork_key -o IdentitiesOnly=yes" \
            git submodule update --init --depth 1 Artwork

      - name: Test
        run: scripts/coverage.sh
