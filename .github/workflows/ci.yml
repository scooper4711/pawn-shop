name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Fetch artwork
        env:
          ARTWORK_SSH_KEY: ${{ secrets.ARTWORK_SSH_KEY }}
        run: |
          if [ -z "$ARTWORK_SSH_KEY" ]; then
            echo "ARTWORK_SSH_KEY is not set; skipping the private Artwork submodule."
            exit 0
          fi
          printf '%s\n' "$ARTWORK_SSH_KEY" > "$RUNNER_TEMP/artwork_key"
          chmod 600 "$RUNNER_TEMP/artwork_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/artwork_key -o IdentitiesOnly=yes" \
            git submodule update --init --depth 1 Artwork

      - name: Show toolchain
        run: swift --version

      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict --quiet

      # Tests that read Paizo's pawn PDFs are skipped: the PDFs are copyrighted and not in the repository.
      - name: Test with coverage gate
        run: scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/sonar-coverage.xml

      - name: Build the app bundle
        run: scripts/build-app.sh

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    # Pull requests from forks have no access to the token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
