name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and coverage
    # The Mac mini runs our own builds; pull requests from forks stay on GitHub's machines, since this is a public
    # repository and a self-hosted runner would run a stranger's code on the mini.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || 'mac-mini' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/version.sh counts every commit for the build number.
          fetch-depth: 0

      - name: Fetch artwork
        env:
          ARTWORK_SSH_KEY: ${{ secrets.ARTWORK_SSH_KEY }}
        run: |
          if [ -z "$ARTWORK_SSH_KEY" ]; then
            echo "ARTWORK_SSH_KEY is not set; skipping the private Artwork submodule."
            exit 0
          fi
          printf '%s\n' "$ARTWORK_SSH_KEY" > "$RUNNER_TEMP/artwork_key"
          chmod 600 "$RUNNER_TEMP/artwork_key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/artwork_key -o IdentitiesOnly=yes" \
            git submodule update --init --depth 1 Artwork

      - name: Show toolchain
        run: swift --version

      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict --quiet

      # Tests that read Paizo's pawn PDFs are skipped: the PDFs are copyrighted and not in the repository.
      - name: Test with coverage gate
        run: scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/sonar-coverage.xml

      - name: Build the app bundle
        run: scripts/build-app.sh

      # The iPad app bundles the imported items in Generated/, which git ignores. Importing reads the pf2e release and
      # the Artwork submodule (fetched above) and takes minutes, so the CI Mac keeps each import, by what decides it,
      # in the runner user's home: not in GitHub's cache, which pull requests from forks could read. Forks' pull
      # requests (on GitHub's machines, without the Artwork key) skip the UI tests.
      - name: Restore the import
        id: generated
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          KEY: ${{ hashFiles('pf2e.release', 'import.sha256', 'scripts/import*.sh') }}
        run: |
          dir="$HOME/.ci-cache/${{ github.event.repository.name }}/generated-$KEY-$(git ls-tree HEAD Artwork | awk '{print $3}')"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [ -d "$dir" ]; then
            rm -rf Generated && cp -Rc "$dir" Generated && echo "hit=true" >> "$GITHUB_OUTPUT"
          fi

      # Keeps this import, and drops older ones.
      - name: Import the items
        if: ${{ !github.event.pull_request.head.repo.fork && steps.generated.outputs.hit != 'true' }}
        env:
          DIR: ${{ steps.generated.outputs.dir }}
        run: |
          REXARD_PACKS=Artwork/rexard scripts/import-items.sh
          rm -rf "$(dirname "$DIR")" && mkdir -p "$(dirname "$DIR")" && cp -Rc Generated "$DIR"

      # Builds the iPad app and runs its UI tests, in a Simulator the CI Mac keeps booted (see the script).
      - name: Run the iPad UI tests
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: scripts/run-ipad-uitests.sh

      - name: Keep the UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: ios/build/UITests.xcresult
          retention-days: 7

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    # Pull requests from forks have no access to the token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
